#:schema node_modules/wrangler/config-schema.json
name = "insta-worker"
main = "src/worker.js"
compatibility_date = "2024-11-06"
workers_dev = true

# ---------------------------------------------------------------------------
# KV namespace: rate limiting + short-lived metadata cache.
#
# No `id` -> auto-provisioned by `wrangler deploy` (Wrangler >= 3.60). The
# worker still runs if KV is missing: the cache and the rate limiter degrade
# gracefully. To bind an existing namespace, add:
#   id = "<namespace-id>"
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"

# ---------------------------------------------------------------------------
# Non-sensitive configuration. Every value has a safe default, so the Deploy
# button works without filling any field.
# ---------------------------------------------------------------------------
[vars]
# Ordered, comma-separated list of upstream providers. First healthy wins.
UPSTREAM_URLS = "https://catplus.ir/api/insta"
# Rate limits (requests per minute per IP or API key).
RATE_LIMIT_PER_MINUTE = "60"
RATE_LIMIT_DOWNLOAD_PER_MINUTE = "20"
RATE_LIMIT_THUMBNAIL_PER_MINUTE = "60"
RATE_LIMIT_HEALTH_PER_MINUTE = "10"
# Hard cap for a proxied download, in megabytes.
MAX_DOWNLOAD_MB = "80"
# Comma-separated CDN host suffixes the proxy may fetch from.
CDN_ALLOWLIST = "*.cdninstagram.com,*.fbcdn.net"
# CORS: "*" (default) or a comma-separated list of allowed origins.
ALLOWED_ORIGINS = "*"
# Short cache TTL for resolved metadata, in seconds (clamped to 60..900).
CACHE_TTL_SECONDS = "120"
# Per-provider upstream timeout in milliseconds (headers and body).
UPSTREAM_TIMEOUT_MS = "12000"

# ---------------------------------------------------------------------------
# Optional secrets. None of them is required, and none is configured here.
# Add them only through the Dashboard (Settings -> Variables and Secrets) or
# `wrangler secret put <NAME>`:
#
#   API_KEYS            comma-separated keys. When set, every /api/v1 request
#                       must send `Authorization: Bearer <key>` or
#                       `x-api-key: <key>`.
#   UPSTREAM_TOKEN      bearer token forwarded only to the matching upstream
#                       (UPSTREAM_TOKEN_HOST, or the only configured provider).
#   UPSTREAM_TOKEN_HOST optional host that owns UPSTREAM_TOKEN.
#   IP_HASH_SECRET      optional random string (>= 16 chars) used to key the
#                       HMAC bucket for IP-based rate limiting.
# ---------------------------------------------------------------------------
